global:
  fullnameOverride: "newt"
  image:
    registry: "ghcr.io"
    repository: "fosrl/newt"
    tag: "1.16.0"
    # Latest stable (2026-08-19); chart 1.5.0 appVersion lags at 1.12.5.
    digest: "sha256:345fdeb369be6608d82c41d70637636c78b2c04a6112ff6ec20fc21c48afc899"
    imagePullPolicy: IfNotPresent
  health:
    enabled: true
    path: "/tmp/healthy"
  resources:
    requests:
      cpu: "25m"
      memory: "64Mi"
    limits:
      cpu: "2000m"
      memory: "256Mi"
  # Kernel WireGuard instead of the userspace netstack: the userspace data
  # path caps tunnel throughput (~25 Mbps measured). Native mode renders the
  # pods privileged with NET_ADMIN + SYS_MODULE — same tradeoff as the old
  # The previous cluster WireGuard gateway used the same tradeoff. Pod
  # networking (no hostNetwork) keeps cluster DNS resolution for target
  # hostnames.
  nativeMode:
    enabled: true

namespace:
  create: false

# One Newt per cluster node; each is its own Pangolin site (multi-site HA).
# Credentials come from Doppler-managed Secrets (auth.keys defaults:
# PANGOLIN_ENDPOINT / NEWT_ID / NEWT_SECRET).
newtInstances:
  - name: "node-1"
    enabled: true
    replicas: 1
    auth:
      existingSecretName: "newt-node-1-creds"
      createSecret: false
    useNativeInterface: true
    extraEnv:
      USE_NATIVE_MAIN_INTERFACE: "true"
    configPersistence:
      enabled: true
      type: emptyDir
      mountPath: "/var/lib/newt"
    healthFile: "/var/lib/newt/healthy"
    mtu: 1420
    nodeSelector:
      kubernetes.io/hostname: "k3s-node-1"
  - name: "node-2"
    enabled: true
    replicas: 1
    auth:
      existingSecretName: "newt-node-2-creds"
      createSecret: false
    useNativeInterface: true
    extraEnv:
      USE_NATIVE_MAIN_INTERFACE: "true"
    configPersistence:
      enabled: true
      type: emptyDir
      mountPath: "/var/lib/newt"
    healthFile: "/var/lib/newt/healthy"
    mtu: 1420
    nodeSelector:
      kubernetes.io/hostname: "k3s-node-2"
  - name: "node-3"
    enabled: true
    replicas: 1
    auth:
      existingSecretName: "newt-node-3-creds"
      createSecret: false
    useNativeInterface: true
    extraEnv:
      USE_NATIVE_MAIN_INTERFACE: "true"
    configPersistence:
      enabled: true
      type: emptyDir
      mountPath: "/var/lib/newt"
    healthFile: "/var/lib/newt/healthy"
    mtu: 1420
    nodeSelector:
      kubernetes.io/hostname: "k3s-node-3"
