name: immich-postgres

imageName: ghcr.io/kavishwar-khankari/immich-postgres:17.10-pgvector0.8.1-vchord0.4.3@sha256:965e22f5123254e2d5635d1b719392c61c48398a50f91370d17529ffedd37709
instances: 1
enablePDB: false

postgresql:
  sharedPreloadLibraries:
    - vchord

storage:
  storageClass: cnpg-longhorn
  size: 10Gi

bootstrap:
  database: immich
  owner: postgres
  credentialSecret: immich-db-owner
  dataChecksums: true

dopplerSecret:
  enabled: true
  name: immich-db-owner
  project: rke2-cluster
  config: main
  secrets:
    - name: IMMICH_DB_USERNAME
      asName: username
    - name: IMMICH_DB_PASSWORD
      asName: password
  managedSecret:
    name: immich-db-owner

# No resource requests or limits are chosen until the disposable storage and
# pgbench benchmarks establish an evidence-based baseline.
resources: {}

temporaryService:
  enabled: true
  name: immich-postgres-lan

# Do not create this resource until after the logical restore. The extension
# declarations are retained here to render only when database.enabled is true.
database:
  enabled: false
  extensions:
    - name: vector
      version: "0.8.1"
    - name: vchord
      version: "0.4.3"
