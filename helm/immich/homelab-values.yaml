# Native Immich (chart 0.13.1 / app v3.4.1).
# External-library mount paths are stable asset identifiers; keep them unchanged.

controllers:
  main:
    containers:
      main:
        image:
          tag: v3.4.1
        env:
          TZ: Asia/Kolkata
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'

immich:
  metrics:
    enabled: false
  persistence:
    library:
      existingClaim: immich-library
  configuration: {}

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          image:
            repository: docker.io/valkey/valkey
            tag: 9.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328  # 9.1-alpine
            pullPolicy: IfNotPresent
  persistence:
    data:
      enabled: true
      type: emptyDir

server:
  enabled: true
  controllers:
    main:
      replicas: 1
      strategy: Recreate
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-server
            tag: v3.4.1@sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b  # v3.4.1
            pullPolicy: IfNotPresent
          env:
            DB_HOSTNAME: immich-postgres-rw
            DB_DATABASE_NAME: immich
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: immich-db-owner
                  key: username
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: immich-db-owner
                  key: password
  ingress:
    main:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
        nginx.ingress.kubernetes.io/proxy-body-size: "100g"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
      hosts:
        - host: immich.techtronics.top
          paths:
            - path: /
              pathType: Prefix
              service:
                identifier: main
      tls:
        - hosts:
            - immich.techtronics.top
  service:
    main:
      type: ClusterIP
  # Library PVC is the media share root; subPaths match on-disk layout and DB paths.
  persistence:
    data:
      enabled: true
      existingClaim: immich-library
      globalMounts:
        - path: /data
          subPath: immich_data
        - path: /usr/src/app/external/kavi
          subPath: nextcloud_personal/kavi/InstantUpload
          readOnly: true
        - path: /usr/src/app/external/xiaomi17
          subPath: "nextcloud_personal/kavi/Xiaomi 17"
          readOnly: true
        - path: /usr/src/app/external/prashant
          subPath: nextcloud_data/prashant/files/InstantUpload
          readOnly: true
        - path: /usr/src/app/external/rashmi
          subPath: nextcloud_data/Rashmi/files/InstantUpload
          readOnly: true
        - path: /usr/src/app/external/nushka
          subPath: nextcloud_data/Nushka/files/InstantUpload
          readOnly: true

machine-learning:
  enabled: true
  controllers:
    main:
      strategy: Recreate
      pod:
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: intel.feature.node.kubernetes.io/gpu
                      operator: In
                      values: ["true"]
      containers:
        main:
          image:
            repository: ghcr.io/immich-app/immich-machine-learning
            tag: v3.4.1-openvino@sha256:97f60b06c5938c326d3ba416bcf24bc94d233f34554c05f3b76336f98ffd5ea9  # v3.4.1-openvino
            pullPolicy: IfNotPresent
          env:
            MACHINE_LEARNING_REQUEST_THREADS: "1"
            MACHINE_LEARNING_MODEL_TTL: "300"
            MACHINE_LEARNING_MODEL_ARENA: "false"
          resources:
            requests:
              memory: 2Gi
            limits:
              memory: 4Gi
              gpu.intel.com/xe: "1"
  persistence:
    cache:
      enabled: true
      type: hostPath
      hostPath: /var/lib/immich-ml-cache
      hostPathType: DirectoryOrCreate
      globalMounts:
        - path: /cache
