# Pangolin config — see https://docs.pangolin.net/self-host/advanced/config-file
# SERVER_SECRET is injected via /root/pangolin/secrets.env (never in git).

gerbil:
    start_port: 51820
    base_endpoint: "pangolin.techtronics.top"

app:
    dashboard_url: "https://pangolin.techtronics.top"
    log_level: "info"
    telemetry:
        anonymous_usage: false

domains:
    domain1:
        base_domain: "techtronics.top"
        cert_resolver: "letsencrypt"
        prefer_wildcard_cert: true

server:
    integration_port: 3003
    # GeoIP/ASN lookup DBs (GeoLite2, refreshed by the geoipupdate
    # container). Loaded at startup only — restart pangolin after the
    # updater's first download. Powers analytics country breakdown and
    # country/ASN resource rules.
    maxmind_db_path: "./config/GeoLite2/GeoLite2-Country.mmdb"
    maxmind_asn_path: "./config/GeoLite2/GeoLite2-ASN.mmdb"
    cors:
        origins: ["https://pangolin.techtronics.top"]
        methods: ["GET", "POST", "PUT", "DELETE", "PATCH"]
        allowed_headers: ["X-CSRF-Token", "Content-Type"]
        credentials: false

flags:
    require_email_verification: false
    disable_signup_without_invite: true
    disable_user_create_org: false
    allow_raw_resources: false
    enable_integration_api: true

traefik:
    # Global middleware applied to all resource routers; defined in
    # config/traefik/dynamic_config.yml (security headers). Must be
    # qualified with @file so it resolves from the http provider.
    additional_middlewares: ["security-headers@file"]
