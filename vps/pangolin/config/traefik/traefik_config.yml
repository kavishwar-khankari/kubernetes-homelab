api:
  insecure: true
  dashboard: true

providers:
  http:
    endpoint: "http://pangolin:3001/api/v1/traefik-config"
    pollInterval: "5s"
  file:
    filename: "/etc/traefik/dynamic_config.yml"

experimental:
  plugins:
    badger:
      moduleName: "github.com/fosrl/badger"
      version: "v1.5.0"

log:
  level: "INFO"
  format: "common"
  maxSize: 100
  maxBackups: 3
  maxAge: 3
  compress: true

# Request-level observability + real-client-IP verification (proves the
# ip6tables DNAT path preserves source IPs for both families).
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: "json"

certificatesResolvers:
  letsencrypt:
    acme:
      dnsChallenge:
        provider: "cloudflare"
        # The VPS's local resolver (Oracle DNS) negatively caches the
        # _acme-challenge NXDOMAINs and breaks propagation checks;
        # verify against public resolvers instead.
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
      email: "admin@techtronics.top"
      storage: "/letsencrypt/acme.json"
      caServer: "https://acme-v02.api.letsencrypt.org/directory"

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        # 60m to match the 3600s proxy timeouts used by the home ingresses.
        readTimeout: "60m"
    http:
      tls:
        certResolver: "letsencrypt"
      encodedCharacters:
        allowEncodedSlash: true
        allowEncodedQuestionMark: true

serversTransport:
  insecureSkipVerify: true

ping:
  entryPoint: "web"
