name: pangolin
services:
  pangolin:
    image: docker.io/fosrl/pangolin:ee-1.21.1
    container_name: pangolin
    restart: unless-stopped
    env_file:
      - /root/pangolin/secrets.env
    ports:
      # Integration API for CLI/blueprint automation — localhost only,
      # never exposed to the internet.
      - 127.0.0.1:3003:3003
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m
    volumes:
      - ./config:/app/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: "10s"
      timeout: "10s"
      retries: 15

  gerbil:
    image: docker.io/fosrl/gerbil:1.4.3
    container_name: gerbil
    restart: unless-stopped
    depends_on:
      pangolin:
        condition: service_healthy
    command:
      - --reachableAt=http://gerbil:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://pangolin:3001/api/v1/
    volumes:
      - ./config/:/var/config
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    ports:
      # Bound to the gateway IP only (10.0.0.150); the primary IP's
      # services (family VPN, nginx DoH) are untouched.
      # Dual-stack: the Pangolin IPv6 is published alongside IPv4 so
      # IPv6 clients hit Traefik directly. The tunnel itself stays IPv4.
      - 10.0.0.150:80:80
      - "2603:c021:4000:8b7b:0:7dee:9b0:eefc:80:80"
      - 10.0.0.150:443:443
      - "2603:c021:4000:8b7b:0:7dee:9b0:eefc:443:443"
      - 10.0.0.150:51820:51820/udp
      # 21820/udp intentionally skipped: it is only required for
      # Pangolin client apps, and this deployment has none.
      # 443/udp intentionally skipped: HTTP/3 QUIC is not enabled.

  traefik:
    image: docker.io/traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    network_mode: service:gerbil # Ports appear on the gerbil service
    depends_on:
      pangolin:
        condition: service_healthy
    env_file:
      - /root/pangolin/secrets.env
    command:
      - --configFile=/etc/traefik/traefik_config.yml
    volumes:
      - ./config/traefik:/etc/traefik:ro # Volume to store the Traefik configuration
      - ./config/letsencrypt:/letsencrypt # Volume to store the Let's Encrypt certificates
      - ./config/traefik/logs:/var/log/traefik # Volume to store Traefik logs
      - ./config/plugins:/plugins-storage # Persist the badger plugin cache across container recreations

networks:
  default:
    driver: bridge
    name: pangolin_frontend
    # IPv6 enabled so Docker creates ip6tables DNAT rules for the
    # published IPv6 ports — this preserves the real IPv6 client source
    # IP for Traefik. Without it, v6 traffic falls back to docker-proxy
    # and every client appears as the bridge gateway (one fake v4 IP).
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.22.0.0/16
          gateway: 172.22.0.1
        - subnet: fd00:9e9a:1::/64
