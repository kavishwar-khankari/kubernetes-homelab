# Pangolin blueprint — public resources (declarative, GitOps)
#
# Apply: dashboard → Settings → Blueprints → paste this file → Apply.
# (Or: `pangolin apply blueprint --file /opt/pangolin/config/blueprint.yaml`)
#
# Conventions:
# - Each resource key under public-resources becomes the resource's
#   Identifier (niceId) in Pangolin. Keep keys stable.
# - Targets reference sites by their Identifier (niceId). The site
#   Identifiers are editable in the dashboard (Sites page) — keep them
#   k3s-node-1 / k3s-node-2 / k3s-node-3.
# - Public resources are intentionally open: no auth block (inline-policy
#   SSO defaults to disabled) PLUS catch-all allow rules that bypass auth
#   for BOTH address families (docs: allow = bypass auth). The rules engine
#   is IP-family strict, so 0.0.0.0/0 alone would NOT match IPv6 clients.
# - Backends are in-cluster Service DNS names reachable from the Newt pods.
# - Healthchecks: `status` omitted (any 2xx passes); `mode: tcp` for
#   backends with no unauthenticated HTTP endpoint (CouchDB).
# - No secrets, no private resources, nothing internal beyond what is
#   already public in this repo.
#
# Docs: https://docs.pangolin.net/manage/blueprints

public-resources:
  librespeed:
    name: LibreSpeed
    mode: http
    full-domain: librespeed.techtronics.top
    ssl: true
    enabled: true
    rules:
      - action: allow
        match: cidr
        value: 0.0.0.0/0
      - action: allow
        match: cidr
        value: ::/0
    targets:
      - site: k3s-node-1
        hostname: librespeed.librespeed
        port: 80
        method: http
        healthcheck:
          hostname: librespeed.librespeed
          port: 80
          path: /
          enabled: true
          scheme: http
          interval: 30
          unhealthy-interval: 10
          timeout: 5
          healthy-threshold: 2
