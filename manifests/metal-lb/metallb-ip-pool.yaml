apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lan-pool
  namespace: metallb-system
spec:
  addresses:
  - 192.168.0.40-192.168.0.70
  - fda1:b2c3:d4e5:1::4000-fda1:b2c3:d4e5:1::40ff
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: strong-nodes-only
  namespace: metallb-system
spec:
  ipAddressPools:
  - lan-pool
  # Announce only from the minecraft node. The Tailscale subnet-router
  # DaemonSet requires `minecraft-server` NOT to exist, so this guarantees the
  # MetalLB announcer is never also a Tailscale router (incident 026).
  nodeSelectors:
  - matchLabels:
      minecraft-server: "true"
  # Pin L2 announcements to the physical NIC. Without this, MetalLB also
  # announces from Cilium pod veths (lxc*), and ARP for the VIP dies when a
  # veth is recycled.
  interfaces:
  - enp6s18