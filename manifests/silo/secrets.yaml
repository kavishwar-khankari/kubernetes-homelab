# Doppler keys required (project: rke2-cluster, config: main):
#   SILO_SECRET_KEY             - at least 32 random characters; back up separately
#   SILO_POSTGRES_PASSWORD      - strong random password
#   SILO_DATABASE_URL           - postgresql://silo:<password>@127.0.0.1:5432/silo?sslmode=disable
#   SILO_MEILI_MASTER_KEY       - strong random Meilisearch master key
#   GARAGE_SILO_ACCESS_KEY      - scoped Garage S3 access key
#   GARAGE_SILO_SECRET_KEY      - scoped Garage S3 secret key
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: silo-secrets
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: rke2-cluster
  config: main
  secrets:
    - SILO_SECRET_KEY
    - SILO_POSTGRES_PASSWORD
    - SILO_DATABASE_URL
    - SILO_MEILI_MASTER_KEY
    - GARAGE_SILO_ACCESS_KEY
    - GARAGE_SILO_SECRET_KEY
  processors:
    SILO_SECRET_KEY:
      type: plain
      asName: SECRET_KEY
    SILO_POSTGRES_PASSWORD:
      type: plain
      asName: POSTGRES_PASSWORD
    SILO_DATABASE_URL:
      type: plain
      asName: DATABASE_URL
    SILO_MEILI_MASTER_KEY:
      type: plain
      asName: MEILI_MASTER_KEY
  managedSecret:
    name: silo-secrets
    namespace: silo
    type: Opaque
