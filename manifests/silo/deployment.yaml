apiVersion: apps/v1
kind: Deployment
metadata:
  name: silo
  namespace: silo
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 7200
  selector:
    matchLabels:
      app: silo
  template:
    metadata:
      labels:
        app: silo
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
      terminationGracePeriodSeconds: 120
      securityContext:
        supplementalGroups:
          - 44
          - 993
      initContainers:
        - name: init-data-dirs
          image: ghcr.io/silo-server/silo-server@sha256:60b58981c0f9b831ac352a18420899fc7f976fc3eee61466027c918032db6ed7 # main after PR #822, amd64
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - >-
              mkdir -p /data/pgdata /data/redis /data/meilisearch /data/silo/plugins
              /data/silo/compat/jellyfin-web
              /cache/download-artifacts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: cache
              mountPath: /cache

        - name: seed-config
          image: ghcr.io/silo-server/silo-server@sha256:60b58981c0f9b831ac352a18420899fc7f976fc3eee61466027c918032db6ed7 # main after PR #822, amd64
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ec"]
          args:
            - |
              : "${GARAGE_SILO_ACCESS_KEY:?GARAGE_SILO_ACCESS_KEY is required}"
              : "${GARAGE_SILO_SECRET_KEY:?GARAGE_SILO_SECRET_KEY is required}"
              umask 077
              cat > /seed/silo.yaml <<EOF
              server:
                listen: ":8080"
                mode: integrated
              s3:
                public_endpoint: https://s3.techtronics.top
                public_region: garage
                public_path_style: true
                public_bucket: silo-assets
                public_access_key: ${GARAGE_SILO_ACCESS_KEY}
                public_secret_key: ${GARAGE_SILO_SECRET_KEY}
                public_url_auth: presigned
                private_endpoint: http://192.168.0.75:3900
                private_region: garage
                private_path_style: true
                private_bucket: silo-private
                private_access_key: ${GARAGE_SILO_ACCESS_KEY}
                private_secret_key: ${GARAGE_SILO_SECRET_KEY}
              scanner:
                workers: 2
                max_concurrent_libraries: 1
                max_concurrent_scoped: 1
              playback:
                transcode_dir: /tmp/silo-transcode
                hw_accel: auto
                transcode_enabled: true
              jellyfin_compat:
                enabled: false
                listen: ":8096"
                public_url: https://silo-jf.techtronics.top
                web_enabled: false
                web_version: 10.11.6
                web_dir: /var/lib/silo/compat/jellyfin-web/current
                web_install_dir: /var/lib/silo/compat/jellyfin-web
              audiobookshelf_compat:
                enabled: false
              EOF
              test -s /seed/silo.yaml
          env:
            - name: GARAGE_SILO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: GARAGE_SILO_ACCESS_KEY
            - name: GARAGE_SILO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: GARAGE_SILO_SECRET_KEY
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: config-seed
              mountPath: /seed

      containers:
        - name: postgres
          image: docker.io/pgvector/pgvector@sha256:1d50c689b0a6511b9ea0a15615281c81a59fd04a08eb35057ec8646fb3a2118a # pg18, amd64
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - listen_addresses=127.0.0.1
            - -c
            - shared_buffers=1GB
            - -c
            - effective_cache_size=3GB
            - -c
            - work_mem=16MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - max_connections=100
            - -c
            - wal_compression=on
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: POSTGRES_USER
              value: silo
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: silo
            - name: POSTGRES_HOST_AUTH_METHOD
              value: scram-sha-256
            - name: POSTGRES_INITDB_ARGS
              value: --auth-host=scram-sha-256
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "-U", "silo", "-d", "silo"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: dshm
              mountPath: /dev/shm

        - name: redis
          image: redis@sha256:519f0189dfdee3bc0bad61fb265fe73d864b5c64020e6579ad48a45c49965635 # 7.4.2-alpine3.21, amd64
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --bind
            - 127.0.0.1
            - --appendonly
            - "yes"
            - --appendfsync
            - everysec
            - --dir
            - /data
          startupProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["redis-cli", "-h", "127.0.0.1", "ping"]
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
              subPath: redis

        - name: meilisearch
          image: docker.io/getmeili/meilisearch@sha256:779b7f3ec3279f9230b5e6399814ee93a873b077433a5ef635d644db3d491a05 # v1.34.3, amd64
          imagePullPolicy: IfNotPresent
          ports:
            - name: meili-http
              containerPort: 7700
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: MEILI_MASTER_KEY
            - name: MEILI_DB_PATH
              value: /meili_data/data.ms
            - name: MEILI_HTTP_ADDR
              value: 0.0.0.0:7700
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_MAX_INDEXING_MEMORY
              value: "268435456"
            - name: MEILI_MAX_INDEXING_THREADS
              value: "1"
          startupProbe:
            httpGet:
              path: /health
              port: meili-http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: meili-http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: meili-http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 500m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /meili_data
              subPath: meilisearch

        - name: silo
          image: ghcr.io/silo-server/silo-server@sha256:60b58981c0f9b831ac352a18420899fc7f976fc3eee61466027c918032db6ed7 # main after PR #822, amd64
          imagePullPolicy: IfNotPresent
          workingDir: /seed
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: MODE
              value: integrated
            - name: PORT
              value: "8080"
            - name: SILO_PUBLIC_URL
              value: https://silo.techtronics.top
            - name: SILO_MIGRATE_TIMEOUT
              value: 60m
            - name: POSTGRES_TUNE
              value: "off"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: DATABASE_URL
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: silo-secrets
                  key: SECRET_KEY
            - name: REDIS_URL
              value: redis://127.0.0.1:6379
            - name: SILO_PLUGIN_CACHE_DIR
              value: /var/lib/silo/plugins
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 360
          readinessProbe:
            httpGet:
              path: /api/v1/ready
              port: http
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
              scheme: HTTP
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
              gpu.intel.com/xe: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/silo
              subPath: silo
            - name: cache
              mountPath: /tmp/silo-transcode
            - name: cache
              mountPath: /tmp/silo-download-artifacts
              subPath: download-artifacts
            - name: media
              mountPath: /mnt/media
              readOnly: true
              mountPropagation: HostToContainer
            - name: config-seed
              mountPath: /seed

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: silo-data
        - name: cache
          persistentVolumeClaim:
            claimName: silo-cache
        - name: media
          hostPath:
            path: /mnt/merged/media
            type: Directory
        - name: config-seed
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
