apiVersion: batch/v1
kind: Job
metadata:
  name: perry-smoke
  namespace: perry
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: perry-smoke
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: smoke
          image: ghcr.io/kavishwar-khankari/perry-the-platypus@sha256:64a2a5cbbe260eaef93522e6636a8ae5f645dcaa12b3338b60b3fadcc2ac00a5 # sha-9c6d637
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - perry.production_smoke
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: PERRY_PROD_URL
              value: http://perry:8000
            # Used only to prove the smoke never reuses the approved phone-test ID.
            - name: PERRY_APPROVED_EVENT_ID
              value: perry-phone-test-001
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 256Mi
              cpu: 200m
