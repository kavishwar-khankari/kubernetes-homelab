apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: arr-gate-api-keys
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system

  project: rke2-cluster
  config: main

  secrets:
    - ARR_GATE_SONARR_API_KEY
    - ARR_GATE_RADARR_API_KEY

  processors:
    ARR_GATE_SONARR_API_KEY:
      type: plain
      asName: ARR_GATE_SONARR_API_KEY
    ARR_GATE_RADARR_API_KEY:
      type: plain
      asName: ARR_GATE_RADARR_API_KEY

  managedSecret:
    name: arr-gate-api-keys
    namespace: tdarr
    type: Opaque
