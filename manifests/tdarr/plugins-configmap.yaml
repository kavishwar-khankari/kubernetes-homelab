    function probeFile(filePath) {
      return new Promise((resolve, reject) => {
        const child = spawn(
          FFPROBE_PATH,
          ['-v', 'error', '-print_format', 'json', '-show_streams', '-show_format', filePath],
          { stdio: ['ignore', 'pipe', 'pipe'] }
        );
