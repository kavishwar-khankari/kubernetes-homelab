  local__Tdarr_Plugin_Local_AV1QSVEncodeHDRAware.js: |
    /* eslint-disable */

    /**
     * Tdarr_Plugin_Local_AV1QSVEncodeHDRAware
     *
     * AV1 QSV encode plugin that reads flow variables set by
     * Tdarr_Plugin_Local_HDRDetectAndTag and injects appropriate
     * HDR metadata flags into the ffmpeg command.
     *
     * Inputs (from Tdarr UI):
     *   - quality:        global_quality value (e.g. 22)
     *   - preset:         QSV preset (e.g. veryslow)
     *   - lookAheadDepth: look_ahead_depth value (e.g. 100)
     *   - bFrames:        bf value (e.g. 8)
     *
     * Reads flow variables:
     *   - hdrFlags: string of ffmpeg flags (set by HDRDetectAndTag)
     *
     * Use via runClassicTranscodePlugin flow node.
     *
     * v1.0.0
     */

    const details = () => ({
      id: 'Tdarr_Plugin_Local_AV1QSVEncodeHDRAware',
      Stage: 'Main processing',
      Name: 'AV1 QSV Encode (HDR-Aware)',
      Type: 'Video',
      Operation: 'Transcode',
      Description:
        'Encodes video to AV1 using QSV with automatic HDR metadata injection from flow variables.',
      Version: '1.0.0',
      Tags: 'action,ffmpeg,qsv,av1,hdr',
      Inputs: [
        {
          name: 'quality',
          type: 'string',
          defaultValue: '22',
          inputUI: { type: 'text' },
          tooltip: 'global_quality value (e.g. 18, 22, 28, 32, 36)',
        },
        {
          name: 'preset',
          type: 'string',
          defaultValue: 'veryslow',
          inputUI: { type: 'text' },
          tooltip: 'QSV preset (veryslow, slower, slow, medium)',
        },
        {
          name: 'lookAheadDepth',
          type: 'string',
          defaultValue: '100',
          inputUI: { type: 'text' },
          tooltip: 'look_ahead_depth value',
        },
        {
          name: 'bFrames',
          type: 'string',
          defaultValue: '8',
          inputUI: { type: 'text' },
          tooltip: 'bf (B-frame) count',
        },
      ],
    });

    const plugin = (file, librarySettings, inputs, otherArguments) => {
      const lib = require('../methods/lib')();
      inputs = lib.loadDefaultValues(inputs, details);

      const quality = inputs.quality || '22';
      const preset = inputs.preset || 'veryslow';
      const lookAheadDepth = inputs.lookAheadDepth || '100';
      const bFrames = inputs.bFrames || '8';

      // Read HDR flags from flow variables (set by HDRDetectAndTag)
      const hdrFlags =
        (otherArguments && otherArguments.variables && otherArguments.variables.hdrFlags) || '';

      // Build the ffmpeg command
      const baseCmd = [
        '-hwaccel qsv',
        '-hwaccel_output_format qsv',
        '<io>',
        '-map 0:v:0',
        '-map 0:a',
        '-map 0:s?',
        '-map 0:t?',
        '-map_metadata 0',
        '-map_chapters 0',
        '-c:s copy',
        '-c:a copy',
        '-c:v av1_qsv',
        `-preset ${preset}`,
        `-global_quality ${quality}`,
        `-look_ahead_depth ${lookAheadDepth}`,
        '-extbrc 1',
        '-adaptive_i 1',
        '-adaptive_b 1',
        '-b_strategy 1',
        `-bf ${bFrames}`,
        '-g 300',
        '-forced_idr 1',
      ];

      // Inject HDR flags after the encoder params, before output
      if (hdrFlags) {
        baseCmd.push(hdrFlags);
      }

      const fullCmd = baseCmd.join(' ');

      const response = {
        processFile: true,
        preset: fullCmd,
        container: '.mkv',
        handBrakeMode: false,
        FFmpegMode: true,
        reQueueAfter: false,
        infoLog: `AV1 QSV Encode: Q${quality}, ${preset}, LA${lookAheadDepth}, bf${bFrames}\n`,
      };

      const hdrType =
        (otherArguments && otherArguments.variables && otherArguments.variables.hdrType) || 'unknown';
      response.infoLog += `HDR type: ${hdrType}\n`;

      if (hdrFlags) {
        response.infoLog += `HDR flags injected: ${hdrFlags}\n`;
      } else {
        response.infoLog += 'No HDR flags (SDR content).\n';
      }

      return response;
    };

    module.exports.details = details;
    module.exports.plugin = plugin;
  local__Tdarr_Plugin_Local_BitrateRouter.js: |
    /* eslint-disable */

    /**
     * Tdarr_Plugin_Local_BitrateRouter
     *
     * Codec-aware bitrate router with minimum bitrate skip floor.
     * Replaces file-size-based routing with bitrate-based routing.
     *
     * Supports two modes (set via 'mode' input):
     *
     *   "floor" — Minimum bitrate check only.
     *       output 1: bitrate is ABOVE floor → continue processing
     *       output 2: bitrate is BELOW floor → skip (too compressed)
     *       Sets flow variables: detectedCodec, videoBitrateKbps, skipBitrate, skipReason
     *
     *   "route" — Threshold-based tier routing only (no floor check).
     *       output 1: bitrate BELOW threshold → lower quality tier
     *       output 2: bitrate AT/ABOVE threshold → higher quality tier (or next router)
     *
     * Chain pattern (3 nodes replaces 2 checkFileSize nodes):
     *
     *   [Floor Check (mode=floor)]
     *       output 1 → [Router A (mode=route, low/mid split)]
     *                       output 1 → Stage 1 (low bitrate)
     *                       output 2 → [Router B (mode=route, mid/high split)]
     *                                       output 1 → Stage 2 (mid bitrate)
     *                                       output 2 → Stage 3 (high bitrate)
     *       output 2 → skiplist ("download a higher bitrate version")
     *
     * All thresholds are per-codec (h264/hevc/other) and configurable from UI.
     * Bitrate fallback: container bitrate if per-stream bitrate is unavailable.
     *
     * Use via runClassicFilterPlugin flow node.
     *
     * v1.0.0
     */

    const details = () => ({
      id: 'Tdarr_Plugin_Local_BitrateRouter',
      Stage: 'Pre-processing',
      Name: 'Bitrate Router (Codec-Aware)',
      Type: 'Video',
      Operation: 'Filter',
      Description:
        'Routes files by video bitrate with codec-aware thresholds. ' +
        'Use mode=floor for minimum bitrate skip, mode=route for tier routing. ' +
        'Chain instances for multi-tier routing.',
      Version: '1.0.0',
      Tags: 'filter,pre-processing,bitrate',
      Inputs: [
        {
          name: 'mode',
          type: 'string',
          defaultValue: 'floor',
          inputUI: {
            type: 'dropdown',
            options: ['floor', 'route'],
          },
          tooltip:
            '"floor" = skip files below minimum bitrate. ' +
            '"route" = split files by bitrate threshold into two tiers.',
        },
        {
          name: 'h264MinKbps',
          type: 'string',
          defaultValue: '4000',
          inputUI: { type: 'text' },
          tooltip:
            '[floor mode] Minimum video bitrate (kbps) for H.264 sources. ' +
            'Files below this are skipped — too compressed to benefit from AV1.',
        },
        {
          name: 'hevcMinKbps',
          type: 'string',
          defaultValue: '3000',
          inputUI: { type: 'text' },
          tooltip:
            '[floor mode] Minimum video bitrate (kbps) for HEVC sources. ' +
            'Files below this are skipped — too compressed to benefit from AV1.',
        },
        {
          name: 'otherMinKbps',
          type: 'string',
          defaultValue: '3000',
          inputUI: { type: 'text' },
          tooltip:
            '[floor mode] Minimum video bitrate (kbps) for other codecs (VC-1, MPEG-2, VP9, etc).',
        },
        {
          name: 'h264ThresholdKbps',
          type: 'string',
          defaultValue: '15000',
          inputUI: { type: 'text' },
          tooltip:
            '[route mode] H.264 bitrate threshold (kbps). ' +
            'Below → output 1 (lower tier). At/above → output 2 (higher tier).',
        },
        {
          name: 'hevcThresholdKbps',
          type: 'string',
          defaultValue: '10000',
          inputUI: { type: 'text' },
          tooltip:
            '[route mode] HEVC bitrate threshold (kbps). ' +
            'Below → output 1 (lower tier). At/above → output 2 (higher tier).',
        },
        {
          name: 'otherThresholdKbps',
          type: 'string',
          defaultValue: '12000',
          inputUI: { type: 'text' },
          tooltip:
            '[route mode] Other codec bitrate threshold (kbps). ' +
            'Below → output 1 (lower tier). At/above → output 2 (higher tier).',
        },
      ],
    });

    const plugin = (file, librarySettings, inputs, otherArguments) => {
      const lib = require('../methods/lib')();
      inputs = lib.loadDefaultValues(inputs, details);

      const mode = inputs.mode || 'floor';

      const response = {
        processFile: true,
        infoLog: '',
      };

      // ─── 1. Identify codec ───
      const videoStream = (file.ffProbeData.streams || []).find(
        (s) => s.codec_type === 'video'
      );

      if (!videoStream) {
        response.processFile = false;
        response.infoLog += 'No video stream found — skipping.\n';
        setVars(otherArguments, 'unknown', 0, true, 'No video stream found');
        return response;
      }

      const codecName = (videoStream.codec_name || '').toLowerCase();
      let codecGroup = 'other';
      if (codecName === 'h264' || codecName === 'avc') {
        codecGroup = 'h264';
      } else if (codecName === 'hevc' || codecName === 'h265') {
        codecGroup = 'hevc';
      }

      response.infoLog += `Codec: ${codecName} (group: ${codecGroup})\n`;

      // ─── 2. Get bitrate ───
      let bitrateKbps = 0;
      let bitrateSource = '';

      if (videoStream.bit_rate) {
        bitrateKbps = parseInt(videoStream.bit_rate, 10) / 1000;
        bitrateSource = 'stream';
      } else if (file.ffProbeData.format && file.ffProbeData.format.bit_rate) {
        // Fallback: container bitrate (overcounts — includes audio/subs)
        bitrateKbps = parseInt(file.ffProbeData.format.bit_rate, 10) / 1000;
        bitrateSource = 'container (approx)';
      }

      const bitrateRounded = Math.round(bitrateKbps);
      response.infoLog += `Video bitrate: ${bitrateRounded} kbps (source: ${bitrateSource || 'unknown'})\n`;

      // If we can't determine bitrate, proceed (route to lower tier as safe default)
      if (bitrateKbps <= 0) {
        response.processFile = true;
        response.infoLog += 'Could not determine bitrate — routing to lower tier (safe default).\n';
        setVars(otherArguments, codecGroup, 0, false, '');
        return response;
      }

      // ─── 3. Mode: floor ───
      if (mode === 'floor') {
        const floors = {
          h264: parseInt(inputs.h264MinKbps, 10) || 4000,
          hevc: parseInt(inputs.hevcMinKbps, 10) || 3000,
          other: parseInt(inputs.otherMinKbps, 10) || 3000,
        };

        const minFloor = floors[codecGroup];

        if (bitrateKbps < minFloor) {
          response.processFile = false;
          const reason =
            `Video bitrate ${bitrateRounded} kbps (${codecName}) is below ` +
            `minimum floor of ${minFloor} kbps for ${codecGroup}. ` +
            `This file is already too compressed to benefit from AV1 re-encoding. ` +
            `Download a higher bitrate version of this file.`;
          response.infoLog += `⚠ SKIP: ${reason}\n`;
          setVars(otherArguments, codecGroup, bitrateRounded, true, reason);
          return response;
        }

        response.processFile = true;
        response.infoLog += `${bitrateRounded} kbps >= ${minFloor} kbps floor (${codecGroup}) → above floor, proceed.\n`;
        setVars(otherArguments, codecGroup, bitrateRounded, false, '');
        return response;
      }

      // ─── 4. Mode: route ───
      const splits = {
        h264: parseInt(inputs.h264ThresholdKbps, 10) || 15000,
        hevc: parseInt(inputs.hevcThresholdKbps, 10) || 10000,
        other: parseInt(inputs.otherThresholdKbps, 10) || 12000,
      };

      const splitPoint = splits[codecGroup];

      if (bitrateKbps < splitPoint) {
        response.processFile = true;
        response.infoLog += `${bitrateRounded} kbps < ${splitPoint} kbps (${codecGroup}) → output 1 (lower tier)\n`;
      } else {
        response.processFile = false;
        response.infoLog += `${bitrateRounded} kbps >= ${splitPoint} kbps (${codecGroup}) → output 2 (higher tier)\n`;
      }

      // Preserve existing vars from floor check, only update if not already set
      if (otherArguments && otherArguments.variables) {
        if (!otherArguments.variables.detectedCodec) {
          otherArguments.variables.detectedCodec = codecGroup;
        }
        if (!otherArguments.variables.videoBitrateKbps) {
          otherArguments.variables.videoBitrateKbps = String(bitrateRounded);
        }
      }

      return response;
    };

    function setVars(otherArguments, codec, bitrateKbps, skipped, reason) {
      if (otherArguments && otherArguments.variables) {
        otherArguments.variables.detectedCodec = codec;
        otherArguments.variables.videoBitrateKbps = String(bitrateKbps);
        otherArguments.variables.skipBitrate = skipped ? 'true' : 'false';
        otherArguments.variables.skipReason = reason;
      }
    }

    module.exports.details = details;
    module.exports.plugin = plugin;
  local__Tdarr_Plugin_Local_CheckSkipHDR.js: |
    /* eslint-disable */

    /**
     * Tdarr_Plugin_Local_CheckSkipHDR
     *
     * Checks the `skipHDR` flow variable set by HDRDetectAndTag.
     * Routes Dolby Vision Profile 5 (and other unencodable HDR) files
     * away from the encode pipeline.
     *
     * Outputs:
     *   output 1 (processFile: true)  → safe to encode, continue
     *   output 2 (processFile: false) → skip this file (DV P5 / unsafe HDR)
     *
     * Use via runClassicFilterPlugin flow node.
     * Place AFTER HDRDetectAndTag, BEFORE bitrate routing.
     *
     * v1.0.0
     */

    const details = () => ({
      id: 'Tdarr_Plugin_Local_CheckSkipHDR',
      Stage: 'Pre-processing',
      Name: 'Check Skip HDR',
      Type: 'Video',
      Operation: 'Filter',
      Description:
        'Checks skipHDR flow variable. Routes DV Profile 5 and other ' +
        'unencodable HDR files to skip. Set by HDRDetectAndTag plugin.',
      Version: '1.0.0',
      Tags: 'filter,pre-processing,hdr',
      Inputs: [],
    });

    const plugin = (file, librarySettings, inputs, otherArguments) => {
      const response = {
        processFile: true,
        infoLog: '',
      };

      const skipHDR =
        (otherArguments &&
          otherArguments.variables &&
          otherArguments.variables.skipHDR) || 'false';

      const hdrType =
        (otherArguments &&
          otherArguments.variables &&
          otherArguments.variables.hdrType) || 'unknown';

      if (skipHDR === 'true') {
        response.processFile = false;
        response.infoLog +=
          `⚠ Skipping file — HDR type "${hdrType}" cannot be safely re-encoded. ` +
          `Dolby Vision Profile 5 has no HDR10 fallback layer. ` +
          `Re-encoding would strip all HDR metadata and produce washed-out output. ` +
          `Keep the original or obtain a DV Profile 7/8 version with HDR10 compatibility.\n`;
      } else {
        response.processFile = true;
        response.infoLog += `HDR check passed (type: ${hdrType}) — safe to encode.\n`;
      }

      return response;
    };

    module.exports.details = details;
    module.exports.plugin = plugin;
  local__Tdarr_Plugin_Local_HDRDetectAndTag.js: |
    /* eslint-disable */

    /**
     * Tdarr_Plugin_Local_HDRDetectAndTag
     *
     * Detects HDR type (SDR / HDR10 / HLG / HDR10+ / DV Profile 5/7/8)
     * and extracts static HDR metadata. Sets flow variables:
     *
     *   - hdrType:  sdr | hdr10 | hlg | hdr10plus | dv_profile5 | dv_profile7 | dv_profile8
     *   - hdrFlags: ffmpeg CLI flags to inject into encode commands (empty for SDR)
     *   - skipHDR:  "true" if the file should be skipped (DV Profile 5)
     *
     * Uses:
     *   - file.ffProbeData for basic color properties (already scanned by Tdarr)
     *   - /usr/lib/jellyfin-ffmpeg/ffprobe for side_data (mastering display, CLL, DOVI)
     *   - No mediainfo dependency
     *
     * Use via runClassicTranscodePlugin flow node.
     * Place AFTER backup, BEFORE size router.
     *
     * v2.0.0
     */

    const details = () => ({
      id: 'Tdarr_Plugin_Local_HDRDetectAndTag',
      Stage: 'Pre-processing',
      Name: 'HDR Detect and Tag',
      Type: 'Video',
      Operation: 'Transcode',
      Description:
        'Detects HDR type and extracts metadata into flow variables for downstream encode nodes.',
      Version: '2.0.0',
      Tags: 'pre-processing,hdr',
      Inputs: [
        {
          name: 'ffprobePath',
          type: 'string',
          defaultValue: '/usr/lib/jellyfin-ffmpeg/ffprobe',
          inputUI: { type: 'text' },
          tooltip: 'Full path to ffprobe binary.',
        },
      ],
    });

    const plugin = async (file, librarySettings, inputs, otherArguments) => {
      const lib = require('../methods/lib')();
      inputs = lib.loadDefaultValues(inputs, details);
      const { execSync } = require('child_process');

      const FFPROBE = inputs.ffprobePath || '/usr/lib/jellyfin-ffmpeg/ffprobe';

      // Ensure variables object exists
      if (otherArguments && !otherArguments.variables) {
        otherArguments.variables = {};
      }

      const response = {
        processFile: false,
        preset: '',
        container: `.${file.container}`,
        handBrakeMode: false,
        FFmpegMode: false,
        reQueueAfter: false,
        infoLog: '',
      };

      const filePath = file._id || file.file;

      // ─── 1. Get color properties from Tdarr's existing ffProbeData ───
      const videoStream = (file.ffProbeData.streams || []).find(
        (s) => s.codec_type === 'video'
      );

      if (!videoStream) {
        response.infoLog += 'No video stream found. Defaulting to SDR.\n';
        setVars(otherArguments, 'sdr', '', false);
        return response;
      }

      const colorTransfer = (videoStream.color_transfer || '').toLowerCase();
      const colorPrimaries = (videoStream.color_primaries || '').toLowerCase();
      const colorSpace = (videoStream.color_space || '').toLowerCase();
      const colorRange = (videoStream.color_range || 'tv').toLowerCase();

      response.infoLog += `From Tdarr scan: color_transfer=${videoStream.color_transfer}, ` +
        `color_primaries=${videoStream.color_primaries}, ` +
        `color_space=${videoStream.color_space}\n`;

      // ─── 2. Quick SDR check — skip ffprobe call entirely for SDR content ───
      const isPQ = colorTransfer === 'smpte2084';
      const isHLG = colorTransfer === 'arib-std-b67';
      const isBT2020 = colorPrimaries === 'bt2020';

      if (!isPQ && !isHLG && !isBT2020) {
        response.infoLog += 'SDR content detected (no PQ/HLG/BT.2020). No HDR handling needed.\n';
        setVars(otherArguments, 'sdr', '', false);
        return response;
      }

      response.infoLog += 'HDR indicators found — running detailed ffprobe for side data...\n';

      // ─── 3. Run ffprobe for side_data (mastering display, CLL, DOVI) ───
      let sideDataList = [];
      let doviProfile = null;

      try {
        // First: get frame side data (mastering display + CLL)
        const frameCmd = [
          JSON.stringify(FFPROBE),
          '-v quiet -print_format json',
          '-select_streams v:0',
          '-read_intervals "%+#1"',
          '-show_frames',
          '-show_entries frame=side_data_list',
          JSON.stringify(filePath),
        ].join(' ');

        const frameRaw = execSync(frameCmd, {
          maxBuffer: 10 * 1024 * 1024,
          timeout: 60000,
        }).toString();

        const frameData = JSON.parse(frameRaw);
        const frames = frameData.frames || [];
        sideDataList = (frames[0] || {}).side_data_list || [];

        response.infoLog += `Found ${sideDataList.length} side_data entries in first frame.\n`;

        // Log what we found
        for (const sd of sideDataList) {
          response.infoLog += `  side_data: ${sd.side_data_type || 'unknown'}\n`;
        }
      } catch (err) {
        response.infoLog += `ffprobe frame scan error: ${err.message}\n`;
        response.infoLog += 'Continuing with stream-level data only.\n';
      }

      // ─── 4. Check for DOVI via ffprobe stream side data ───
      try {
        const streamCmd = [
          JSON.stringify(FFPROBE),
          '-v quiet -print_format json',
          '-select_streams v:0',
          '-show_streams',
          '-show_entries stream_side_data',
          JSON.stringify(filePath),
        ].join(' ');

        const streamRaw = execSync(streamCmd, {
          maxBuffer: 10 * 1024 * 1024,
          timeout: 60000,
        }).toString();

        const streamData = JSON.parse(streamRaw);
        const streams = streamData.streams || [];
        const vStream = streams[0] || {};
        const streamSideData = vStream.side_data_list || [];

        for (const sd of streamSideData) {
          const sdType = (sd.side_data_type || '').toLowerCase();

          if (sdType.includes('dovi') || sdType.includes('dolby vision')) {
            // ffprobe reports dv_profile as an integer
            if (sd.dv_profile !== undefined) {
              doviProfile = parseInt(sd.dv_profile, 10);
              response.infoLog += `DOVI config record found: profile=${doviProfile}, ` +
                `bl_present=${sd.dv_bl_signal_compatibility_id}, ` +
                `level=${sd.dv_level}\n`;
            } else {
              response.infoLog += `DOVI side_data found but no profile field: ${JSON.stringify(sd)}\n`;
            }
          }
        }

        // Also merge any frame-level side data we might have missed
        for (const sd of streamSideData) {
          if (!sideDataList.find((e) => e.side_data_type === sd.side_data_type)) {
            sideDataList.push(sd);
          }
        }
      } catch (err) {
        response.infoLog += `ffprobe stream side_data scan error: ${err.message}\n`;
      }

      // ─── 5. Fallback DOVI detection from codec profile string ───
      if (doviProfile === null) {
        // Some files expose DV in the codec_tag_string like "dvhe" or "dvh1"
        const tagStr = (videoStream.codec_tag_string || '').toLowerCase();
        const codecProfile = (videoStream.profile || '').toLowerCase();

        if (tagStr.includes('dvhe') || tagStr.includes('dvh1') || tagStr.includes('dvav')) {
          // Can't determine exact profile without DOVI config, treat as unknown → skip
          doviProfile = -1; // sentinel for "DV detected but profile unknown"
          response.infoLog += `DV detected from codec_tag_string: ${tagStr} (profile unknown)\n`;
        } else if (codecProfile.includes('dolby vision')) {
          doviProfile = -1;
          response.infoLog += `DV detected from profile string: ${codecProfile} (profile unknown)\n`;
        }
      }

      // ─── 6. Extract HDR10 static metadata from side_data ───
      let masterDisplay = null;
      let maxCLL = null;
      let maxFALL = null;

      for (const sd of sideDataList) {
        const sdType = sd.side_data_type || '';

        if (/mastering display/i.test(sdType)) {
          const g = parseChromaticity(sd.green_x, sd.green_y);
          const b = parseChromaticity(sd.blue_x, sd.blue_y);
          const r = parseChromaticity(sd.red_x, sd.red_y);
          const wp = parseChromaticity(sd.white_point_x, sd.white_point_y);
          const lumMax = parseLuminance(sd.max_luminance);
          const lumMin = parseLuminance(sd.min_luminance);

          if (g && b && r && wp && lumMax !== null && lumMin !== null) {
            masterDisplay = `G(${g})B(${b})R(${r})WP(${wp})L(${lumMax},${lumMin})`;
          }
          response.infoLog += `Mastering display: green=${sd.green_x},${sd.green_y} ` +
            `blue=${sd.blue_x},${sd.blue_y} red=${sd.red_x},${sd.red_y} ` +
            `wp=${sd.white_point_x},${sd.white_point_y} ` +
            `lum=${sd.min_luminance}-${sd.max_luminance}\n`;
          if (masterDisplay) {
            response.infoLog += `  → Formatted: ${masterDisplay}\n`;
          } else {
            response.infoLog += `  → Could not format mastering display (some values missing)\n`;
          }
        }

        if (/content light/i.test(sdType)) {
          maxCLL = parseInt(sd.max_content || sd.max_content_light_level || '0', 10);
          maxFALL = parseInt(sd.max_average || sd.max_frame_average_light_level || '0', 10);
          response.infoLog += `Content light level: MaxCLL=${maxCLL}, MaxFALL=${maxFALL}\n`;
        }
      }

      // ─── 7. Classify HDR type ───
      let hdrType = 'sdr';
      let skipHDR = false;

      if (doviProfile === 5) {
        hdrType = 'dv_profile5';
        skipHDR = true;
        response.infoLog += '⚠ Dolby Vision Profile 5 — NO HDR10 fallback. Skipping.\n';
      } else if (doviProfile === 7) {
        hdrType = 'dv_profile7';
        response.infoLog += 'Dolby Vision Profile 7 (HDR10 compatible) — will preserve HDR10 base.\n';
      } else if (doviProfile === 8) {
        hdrType = 'dv_profile8';
        response.infoLog += 'Dolby Vision Profile 8 (HDR10 compatible) — will preserve HDR10 base.\n';
      } else if (doviProfile === -1) {
        // DV detected but unknown profile — skip for safety
        hdrType = 'dv_profile5';
        skipHDR = true;
        response.infoLog += '⚠ Dolby Vision detected but profile unknown — skipping for safety.\n';
      } else if (doviProfile !== null && doviProfile !== 7 && doviProfile !== 8) {
        // Known but unsupported DV profile
        hdrType = 'dv_profile5';
        skipHDR = true;
        response.infoLog += `⚠ Dolby Vision Profile ${doviProfile} — unsupported, skipping.\n`;
      } else if (isHLG) {
        hdrType = 'hlg';
        response.infoLog += 'HLG content detected.\n';
      } else if (isPQ || isBT2020) {
        // Check for HDR10+ dynamic metadata
        const hasHdr10Plus = sideDataList.some(
          (sd) => {
            const t = (sd.side_data_type || '').toLowerCase();
            return t.includes('hdr10+') || t.includes('dynamic') ||
                   t.includes('itut_t35') || t.includes('itu_t_t35');
          }
        );
        if (hasHdr10Plus) {
          hdrType = 'hdr10plus';
          response.infoLog += 'HDR10+ detected — dynamic metadata will be lost, HDR10 base preserved.\n';
        } else {
          hdrType = 'hdr10';
          response.infoLog += 'HDR10 content detected.\n';
        }
      }

      // ─── 8. Build FFmpeg HDR flags ───
      let hdrFlags = '';

      if (hdrType !== 'sdr' && !skipHDR) {
        const parts = [];

        if (hdrType === 'hlg') {
          parts.push('-color_primaries bt2020');
          parts.push('-color_trc arib-std-b67');
          parts.push('-colorspace bt2020nc');
          parts.push('-color_range tv');
        } else {
          // HDR10, HDR10+, DV P7/P8 — all use PQ + BT.2020
          parts.push('-color_primaries bt2020');
          parts.push('-color_trc smpte2084');
          parts.push(`-colorspace ${colorSpace === 'bt2020c' ? 'bt2020c' : 'bt2020nc'}`);
          parts.push(`-color_range ${colorRange === 'pc' ? 'pc' : 'tv'}`);
        }

        // Static metadata
        if (hdrType !== 'hlg') {
          if (masterDisplay) {
            parts.push(`-master_display "${masterDisplay}"`);
          }
          if (maxCLL !== null && maxFALL !== null) {
            parts.push('-max_muxing_queue_size 4096');
            parts.push(`-content_light_level "${maxCLL},${maxFALL}"`);
          }
        }

        hdrFlags = parts.join(' ');
      }

      response.infoLog += `\n→ hdrType=${hdrType}\n→ skipHDR=${skipHDR}\n→ hdrFlags=${hdrFlags}\n`;

      // ─── 9. Set flow variables ───
      setVars(otherArguments, hdrType, hdrFlags, skipHDR);

      return response;
    };

    // ─── Helpers ───

    function setVars(otherArguments, hdrType, hdrFlags, skipHDR) {
      if (otherArguments) {
        if (!otherArguments.variables) {
          otherArguments.variables = {};
        }
        otherArguments.variables.hdrType = hdrType;
        otherArguments.variables.hdrFlags = hdrFlags;
        otherArguments.variables.skipHDR = skipHDR ? 'true' : 'false';
      }
    }

    function parseChromaticity(xVal, yVal) {
      const x = parseRational(xVal);
      const y = parseRational(yVal);
      if (x === null || y === null) return null;
      // ffprobe gives chromaticity as rationals (e.g., "13250/1" meaning 0.265)
      // master_display expects values as integers in 1/50000 scale
      // If values are already large (>1), they're likely already in the correct scale
      let xInt, yInt;
      if (x > 1) {
        xInt = Math.round(x);
        yInt = Math.round(y);
      } else {
        xInt = Math.round(x * 50000);
        yInt = Math.round(y * 50000);
      }
      return `${xInt},${yInt}`;
    }

    function parseLuminance(val) {
      const v = parseRational(val);
      if (v === null) return null;
      // ffprobe gives luminance as rationals (e.g., "10000000/1" or "50/1")
      // master_display expects integers in 1/10000 scale
      // If value is already large (>100), it's likely already in the correct scale
      if (v > 100) {
        return Math.round(v);
      }
      return Math.round(v * 10000);
    }

    function parseRational(val) {
      if (val === undefined || val === null) return null;
      const s = String(val).trim();
      if (s === '') return null;
      if (s.includes('/')) {
        const [num, den] = s.split('/').map(Number);
        if (den === 0 || isNaN(num) || isNaN(den)) return null;
        return num / den;
      }
      const n = Number(s);
      return isNaN(n) ? null : n;
    }

    module.exports.details = details;
    module.exports.plugin = plugin;
  local__Tdarr_Plugin_Local_ResetToCachedOriginal.js: |
    /* eslint-disable */

    /**
     * Tdarr_Plugin_Local_ResetToCachedOriginal  v4.0.0
     *
     * Drop-in replacement for setOriginalFile (used via runClassicTranscodePlugin).
     *
     * TWO MODES:
     *   BACKUP MODE  — no .tdarr_original found in work root → create it
     *   RESTORE MODE — .tdarr_original exists → copy it to current working path
     *
     * KEY INSIGHT: Tdarr uses a root work directory per job (e.g.
     *   /temp/tdarr-workDir2-JOBID/) and encode stages create timestamped
     *   subdirectories within it (e.g. /temp/tdarr-workDir2-JOBID/1772537800633/).
     *   The backup must live in the ROOT work dir so it can be found regardless
     *   of which subdirectory the current stage is working in.
     */

    const details = () => ({
      id: 'Tdarr_Plugin_Local_ResetToCachedOriginal',
      Stage: 'Pre-processing',
      Name: 'Reset to Cached Original (NAS-safe)',
      Type: 'Any',
      Operation: 'None',
      Description:
        'On first call, backs up the pristine cache copy to the work root dir. '
        + 'On subsequent calls, restores from that backup to the current working '
        + 'directory. All I/O stays on local cache disk.',
      Version: '4.0.0',
      Tags: 'pre-processing',
      Inputs: [],
    });

    // eslint-disable-next-line no-unused-vars
    const plugin = (file, librarySettings, inputs, otherArguments) => {
      const lib = require('../methods/lib')();
      const fs = require('fs');
      const path = require('path');

      const response = {
        processFile: false,
        preset: '',
        container: `.${file.container}`,
        handBrakeMode: false,
        FFmpegMode: false,
        reQueueAfter: false,
        infoLog: '',
      };

      // --- Identify paths ---
      const origLibFile = otherArguments?.originalLibraryFile;
      const nasOriginalPath = origLibFile?._id || file._id;
      const currentWorkingFile = file.file;

      response.infoLog += `NAS original: ${nasOriginalPath}\n`;
      response.infoLog += `Current working file: ${currentWorkingFile}\n`;

      // --- Find the work ROOT directory ---
      // Tdarr work dirs follow the pattern:
      //   /temp/tdarr-workDir2-JOBID/                    (root)
      //   /temp/tdarr-workDir2-JOBID/file.mkv            (after copyToWorkDir)
      //   /temp/tdarr-workDir2-JOBID/1772537800633/file.mkv (after encode stage)
      //
      // We find the root by looking for the "tdarr-workDir" pattern in the path.
      let workRoot = '';

      if (currentWorkingFile && currentWorkingFile !== nasOriginalPath) {
        const parts = currentWorkingFile.split(path.sep);
        for (let i = 0; i < parts.length; i++) {
          if (parts[i].includes('tdarr-workDir')) {
            // The work root is everything up to and including this directory
            workRoot = parts.slice(0, i + 1).join(path.sep);
            break;
          }
        }
      }

      if (!workRoot) {
        response.infoLog += 'ERROR: Cannot find tdarr-workDir in path.\n';
        response.infoLog += 'Falling back to NAS original.\n';
        file.file = nasOriginalPath;
        return response;
      }

      response.infoLog += `Work root: ${workRoot}\n`;

      // --- Backup path (always in work root) ---
      const originalBasename = path.basename(nasOriginalPath);
      const originalExt = path.extname(nasOriginalPath);
      const originalName = path.basename(nasOriginalPath, originalExt);
      const backupName = `${originalName}.tdarr_original${originalExt}`;
      const backupPath = path.join(workRoot, backupName);

      response.infoLog += `Backup path: ${backupPath}\n`;

      // --- Current working directory (where encode stages read/write) ---
      const currentDir = path.dirname(currentWorkingFile);
      const workingPath = path.join(currentDir, originalBasename);

      response.infoLog += `Working path: ${workingPath}\n`;

      // =========================================================
      //  MODE 1: BACKUP — no backup exists yet
      // =========================================================
      if (!fs.existsSync(backupPath)) {
        response.infoLog += `--- BACKUP MODE ---\n`;

        if (fs.existsSync(currentWorkingFile)) {
          try {
            fs.copyFileSync(currentWorkingFile, backupPath);
            const stat = fs.statSync(backupPath);
            response.infoLog += `Created backup: ${backupPath} `
              + `(${(stat.size / 1048576).toFixed(1)} MB)\n`;
            response.infoLog += `Working file unchanged.\n`;
          } catch (err) {
            response.infoLog += `ERROR creating backup: ${err.message}\n`;
          }
        } else {
          // Fallback: copy from NAS
          response.infoLog += `Working file not found. Copying from NAS...\n`;
          if (fs.existsSync(nasOriginalPath)) {
            try {
              fs.copyFileSync(nasOriginalPath, backupPath);
              response.infoLog += `Created backup from NAS (fallback).\n`;
            } catch (err) {
              response.infoLog += `ERROR: ${err.message}\n`;
              file.file = nasOriginalPath;
            }
          } else {
            response.infoLog += `ERROR: NAS original not found either.\n`;
            file.file = nasOriginalPath;
          }
        }

        return response;
      }

      // =========================================================
      //  MODE 2: RESTORE — backup exists, restore from it
      // =========================================================
      response.infoLog += `--- RESTORE MODE ---\n`;

      const backupStat = fs.statSync(backupPath);
      response.infoLog += `Backup: ${(backupStat.size / 1048576).toFixed(1)} MB\n`;

      try {
        // Ensure target directory exists
        if (!fs.existsSync(currentDir)) {
          fs.mkdirSync(currentDir, { recursive: true });
          response.infoLog += `Created dir: ${currentDir}\n`;
        }

        fs.copyFileSync(backupPath, workingPath);
        const restoredStat = fs.statSync(workingPath);
        response.infoLog += `Restored to: ${workingPath} `
          + `(${(restoredStat.size / 1048576).toFixed(1)} MB)\n`;
        file.file = workingPath;
        response.infoLog += `Zero NAS reads.\n`;
      } catch (err) {
        response.infoLog += `ERROR restoring: ${err.message}\n`;
        response.infoLog += `Falling back to NAS.\n`;
        file.file = nasOriginalPath;
      }

      return response;
    };

    module.exports.details = details;
    module.exports.plugin = plugin;
kind: ConfigMap
metadata:
  name: tdarr-git-plugins
  namespace: tdarr
