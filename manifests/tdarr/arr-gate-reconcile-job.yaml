apiVersion: batch/v1
kind: Job
metadata:
  name: arr-gate-reconcile
  namespace: tdarr
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app: arr-gate-reconcile
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
      - name: reconcile
        image: python:3.13-slim-bookworm@sha256:dd86541a59b252667f4c12f8b2ee17216de37dd65ac773bf097bef996fa78860 # 3.13
        imagePullPolicy: IfNotPresent
        command:
        - python3
        - /scripts/arr-gate-reconcile.py
        env:
        - name: TZ
          value: Asia/Kolkata
        - name: ARR_GATE_SONARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: arr-gate-api-keys
              key: ARR_GATE_SONARR_API_KEY
              optional: true
        - name: ARR_GATE_RADARR_API_KEY
          valueFrom:
            secretKeyRef:
              name: arr-gate-api-keys
              key: ARR_GATE_RADARR_API_KEY
              optional: true
        volumeMounts:
        - name: gate-scripts
          mountPath: /scripts
          readOnly: true
        - name: desired
          mountPath: /desired
          readOnly: true
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
      volumes:
      - name: gate-scripts
        configMap:
          name: tdarr-gate-scripts
          defaultMode: 0555
      - name: desired
        configMap:
          name: tdarr-git-desired
          defaultMode: 0444
          items:
          - key: arr-gate-settings.json
            path: arr-gate-settings.json
