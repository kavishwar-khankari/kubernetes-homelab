# Newt site credentials (3 sites, one per cluster node).
# Doppler values (project rke2-cluster, config main):
#   NEWT_NODE_1_ID / NEWT_NODE_1_SECRET
#   NEWT_NODE_2_ID / NEWT_NODE_2_SECRET
#   NEWT_NODE_3_ID / NEWT_NODE_3_SECRET
#   NEWT_PANGOLIN_ENDPOINT = https://pangolin.techtronics.top
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: newt-node-1-creds
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: rke2-cluster
  config: main
  secrets:
    - NEWT_NODE_1_ID
    - NEWT_NODE_1_SECRET
    - NEWT_PANGOLIN_ENDPOINT
  processors:
    NEWT_NODE_1_ID:
      type: plain
      asName: NEWT_ID
    NEWT_NODE_1_SECRET:
      type: plain
      asName: NEWT_SECRET
    NEWT_PANGOLIN_ENDPOINT:
      type: plain
      asName: PANGOLIN_ENDPOINT
  managedSecret:
    name: newt-node-1-creds
    namespace: newt
    type: Opaque
---
