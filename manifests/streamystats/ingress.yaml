apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamystats-ingress
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    # SSE event stream (job progress) needs unbuffered proxying
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx-private
  tls:
    - hosts:
        - streamystats.techtronics.top
  rules:
    - host: streamystats.techtronics.top
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamystats
                port:
                  number: 3000
