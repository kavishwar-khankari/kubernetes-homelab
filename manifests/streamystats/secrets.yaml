# Doppler keys required (project: rke2-cluster, config: main):
#   STREAMYSTATS_SESSION_SECRET                     - openssl rand -base64 32
#   STREAMYSTATS_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY - openssl rand -hex 16
#   STREAMYSTATS_POSTGRES_PASSWORD                  - strong random password
#   STREAMYSTATS_DATABASE_URL                       - postgresql://streamystats:<STREAMYSTATS_POSTGRES_PASSWORD>@127.0.0.1:5432/streamystats
#                                                    (127.0.0.1: all three containers share the pod network)
apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: streamystats-secrets
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  tokenSecret:
    name: doppler-token-secret
    namespace: doppler-operator-system
  project: rke2-cluster
  config: main
  secrets:
    - STREAMYSTATS_SESSION_SECRET
    - STREAMYSTATS_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    - STREAMYSTATS_POSTGRES_PASSWORD
    - STREAMYSTATS_DATABASE_URL
  processors:
    STREAMYSTATS_SESSION_SECRET:
      type: plain
      asName: SESSION_SECRET
    STREAMYSTATS_NEXT_SERVER_ACTIONS_ENCRYPTION_KEY:
      type: plain
      asName: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
    STREAMYSTATS_POSTGRES_PASSWORD:
      type: plain
      asName: POSTGRES_PASSWORD
    STREAMYSTATS_DATABASE_URL:
      type: plain
      asName: DATABASE_URL
  managedSecret:
    name: streamystats-secrets
    namespace: streamystats
    type: Opaque
