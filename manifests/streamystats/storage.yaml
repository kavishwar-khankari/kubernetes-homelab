apiVersion: v1
kind: Namespace
metadata:
  name: streamystats
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: streamystats-data
  namespace: streamystats
  labels:
    recurring-job-group.longhorn.io/default: enabled
    recurring-job-group.longhorn.io/streamystats: enabled
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: streamystats-snapshot-hourly
  namespace: longhorn-system
spec:
  cron: "0 * * * *"
  task: snapshot
  groups:
    - streamystats
  retain: 24
  concurrency: 1
