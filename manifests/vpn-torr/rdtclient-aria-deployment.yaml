apiVersion: apps/v1
kind: Deployment
metadata:
  name: rdtclient-aria
  namespace: vpn-torr
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: rdtclient-aria
  template:
    metadata:
      labels:
        app: rdtclient-aria
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-node-2

      terminationGracePeriodSeconds: 30

      containers:
        - name: rdtclient
          image: rogerfar/rdtclient@sha256:647db1c0040b1b28bb0e874fd2b58e315c52004c0c27d24e0e0b9be7f6d92469  # v2.0.142
          imagePullPolicy: IfNotPresent
          ports:
            - name: rdtclient
              containerPort: 6500
              protocol: TCP
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: rdtclient-db
              mountPath: /data/db
            - name: media-nas
              mountPath: /data/downloads
              subPath: rdtclient
              mountPropagation: HostToContainer

        - name: aria2
          image: p3terx/aria2-pro@sha256:086d1a37c586edb07ec0fb956bf9edd89d1d38d138ad5309ff96d510c8c9a011  # latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: UMASK_SET
              value: "022"
            - name: TZ
              value: "Asia/Kolkata"
            - name: RPC_PORT
              value: "6800"
            - name: LISTEN_PORT
              value: "6888"
            - name: RPC_SECRET
              valueFrom:
                secretKeyRef:
                  name: vpn-torr-secrets
                  key: ARIA2_RPC_SECRET
            - name: DISK_CACHE
              value: "1024M"
            - name: IPV6_MODE
              value: "false"
              # Home network is IPv4-only (no VPN); only the gluetun pod gets IPv6.
            - name: UPDATE_TRACKERS
              value: "true"
          ports:
            - name: aria2-rpc
              containerPort: 6800
              protocol: TCP
            - name: aria2-bt-tcp
              containerPort: 6888
              protocol: TCP
            - name: aria2-bt-udp
              containerPort: 6888
              protocol: UDP
          volumeMounts:
            - name: aria2-config
              mountPath: /config
            - name: media-nas
              mountPath: /data/downloads
              subPath: rdtclient
              mountPropagation: HostToContainer
          readinessProbe:
            tcpSocket:
              port: 6800
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 6800
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

        - name: ariang
          image: p3terx/ariang@sha256:7c72d41ed3937e8903dc97f7bc0f294efe6636ea222017bc850fd3952cfc6f24  # latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: ariang
              containerPort: 6880
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 6880
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 6

      volumes:
        - name: media-nas
          hostPath:
            path: /mnt/nas/media
            type: Directory
        - name: rdtclient-db
          persistentVolumeClaim:
            claimName: rdtclient-db
        - name: aria2-config
          persistentVolumeClaim:
            claimName: aria2-config
