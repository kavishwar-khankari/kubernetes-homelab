apiVersion: apps/v1
kind: Deployment
metadata:
  name: arr-stack
  namespace: arr-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arr-stack
  template:
    metadata:
      labels:
        app: arr-stack
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k3s-node-2
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
      initContainers:
        - name: ensure-qbit-dir
          image: busybox:1.36
          command: ["sh", "-lc", "mkdir -p /share/qbittorent"]
          volumeMounts:
            - name: media-nas
              mountPath: /share
              mountPropagation: HostToContainer
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr@sha256:fc0ae3c50f8128b97e84381903ec8d6845c3a569641cb7117c124376cccb57c1  # 6.4.4.10685-ls323
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7878
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
            - name: ARR_GATE_MEDIA_ROOT
              value: "/media_2"
            - name: ARR_GATE_ROOTS
              value: "/media_2/series/anime/:/media_2/series/web series/:/media_2/001.MOVIES/:/media_2/4k movies/"
          volumeMounts:
            - name: radarr-config
              mountPath: /config
            - name: arr-gate-script
              mountPath: /scripts
              readOnly: true
            - name: media-merged
              mountPath: /media_2
              mountPropagation: HostToContainer
            - name: media-merged
              mountPath: /downloads
              subPath: qbittorent
              mountPropagation: HostToContainer
            - name: rdtclient-downloads
              mountPath: /rdtclient-downloads
              mountPropagation: HostToContainer
          readinessProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 7878
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

        - name: sonarr
          image: lscr.io/linuxserver/sonarr@sha256:44b06045a98bc1f237b9ffefc4b28dab64cb29305e4a2a94875ae93b5224e4cc  # 4.0.20.3014-ls329
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8989
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
            - name: ARR_GATE_MEDIA_ROOT
              value: "/media_2"
            - name: ARR_GATE_ROOTS
              value: "/media_2/series/anime/:/media_2/series/web series/:/media_2/001.MOVIES/:/media_2/4k movies/"
          volumeMounts:
            - name: sonarr-config
              mountPath: /config
            - name: arr-gate-script
              mountPath: /scripts
              readOnly: true
            - name: media-merged
              mountPath: /media_2
              mountPropagation: HostToContainer
            - name: media-merged
              mountPath: /downloads
              subPath: qbittorent
              mountPropagation: HostToContainer
            - name: rdtclient-downloads
              mountPath: /rdtclient-downloads
              mountPropagation: HostToContainer
          readinessProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 8989
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

        #- name: lidarr
        #  image: lscr.io/linuxserver/lidarr@sha256:60be9a1faad3dfba5a711163fc18526845e2ce7b50b463dd9effae7f766c9beb  # 3.1.0.4875-ls37
        #  imagePullPolicy: IfNotPresent
        #  ports:
        #    - name: http
        #      containerPort: 8686
        #  env:
        #    - name: PUID
        #      value: "1000"
        #    - name: PGID
        #      value: "1000"
        #    - name: TZ
        #      value: "Asia/Kolkata"
        #  volumeMounts:
        #    - name: lidarr-config
        #      mountPath: /config
        #    - name: media-merged
        #      mountPath: /media_2
        #      mountPropagation: HostToContainer
        #    - name: media-merged
        #      mountPath: /downloads
        #      subPath: qbittorent
        #      mountPropagation: HostToContainer
        #    - name: rdtclient-downloads
        #      mountPath: /rdtclient-downloads
        #      mountPropagation: HostToContainer
        #  readinessProbe:
        #    tcpSocket:
        #      port: 8686
        #    initialDelaySeconds: 10
        #    periodSeconds: 10
        #    failureThreshold: 6
        #  livenessProbe:
        #    tcpSocket:
        #      port: 8686
        #    initialDelaySeconds: 30
        #    periodSeconds: 20
        #    failureThreshold: 6

        - name: wizarr
          image: ghcr.io/wizarrrr/wizarr@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a  # v2026.10.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5690
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Asia/Kolkata"
            - name: DISABLE_BUILTIN_AUTH
              value: "false"
          volumeMounts:
            - name: wizarr-data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 5690
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5690
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

        - name: jellyseerr
          image: ghcr.io/seerr-team/seerr@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be  # v3.5.1
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - name: http
              containerPort: 5055
          env:
            - name: TZ
              value: "Asia/Kolkata"
          volumeMounts:
            - name: jellyseerr-config
              mountPath: /app/config
          readinessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 5055
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6

      volumes:
        - name: radarr-config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: sonarr-config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: arr-gate-script
          configMap:
            name: arr-av1-jellyfin-gate-script
            defaultMode: 0555
            items:
              - key: arr-av1-jellyfin-gate.sh
                path: arr-av1-jellyfin-gate.sh
        #- name: lidarr-config
        #  persistentVolumeClaim:
        #    claimName: lidarr-config
        - name: wizarr-data
          persistentVolumeClaim:
            claimName: wizarr-data
        - name: jellyseerr-config
          persistentVolumeClaim:
            claimName: jellyseerr-config
        - name: media-merged
          hostPath:
            path: /mnt/merged/media
            type: Directory
        - name: media-nas
          hostPath:
            path: /mnt/nas/media
            type: Directory
        - name: rdtclient-downloads
          hostPath:
            path: /mnt/nas/media/rdtclient
            type: DirectoryOrCreate
