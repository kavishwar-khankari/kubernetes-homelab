apiVersion: batch/v1
kind: Job
metadata:
  name: perry-staging-smoke
  namespace: perry-staging
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: perry-staging-smoke
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: smoke
          image: ghcr.io/kavishwar-khankari/perry-the-platypus@sha256:93b271dac6473cff30fd72d52daf3db3c1c297a5866607a315bcfff63fb0ffc1 # sha-8861ff3
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - perry.staging_smoke
          env:
            - name: TZ
              value: Asia/Kolkata
            - name: PERRY_STAGE_URL
              value: http://perry-staging:8000
            - name: PERRY_STAGE_SINK_URL
              value: http://perry-staging-sink:8080
            - name: PERRY_STAGE_EVENT_PREFIX
              value: stage-
          resources:
            requests:
              memory: 64Mi
              cpu: 20m
            limits:
              memory: 256Mi
              cpu: 200m
